name: product (pytest + ClickHouse)
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8   # keep in sync with docker-compose.yml
        env:
          CLICKHOUSE_DB: anomalyos
          CLICKHOUSE_USER: anomalyos
          CLICKHOUSE_PASSWORD: ci-only-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PULSEOS_ENV: ci
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: anomalyos
      CLICKHOUSE_USER: anomalyos
      CLICKHOUSE_PASSWORD: ci-only-password
      PULSEOS_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: python -m pulseos doctor
      - run: pytest -v
