# Local development only. Single-node ClickHouse; not production infrastructure.
# Ports bind to 127.0.0.1 so the dev database is not exposed on the network.
name: anomalyos

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: anomalyos-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-anomalyos}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-anomalyos}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-local-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  clickhouse-data:
